
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Le jeu du chat 🐱</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e9f5e5;
            color: #24452c;
            text-align: center;
        }

        header {
            background: #237a3b;
            color: white;
            padding: 20px 10px;
        }

        header h1 { margin: 0 0 8px; }

        main { padding: 15px; }

        #map {
            width: 100%;
            max-width: 1100px;
            height: 60vh;
            min-height: 350px;
            margin: 15px auto;
            border: 3px solid #237a3b;
            border-radius: 12px;
            z-index: 1;
        }

        button {
            background: #269447;
            color: white;
            border: none;
            padding: 14px 18px;
            margin: 6px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #17652e; }

        #infos {
            background: white;
            border-radius: 10px;
            padding: 12px;
            max-width: 600px;
            margin: 12px auto;
            overflow-wrap: anywhere;
        }

        .player-marker, .mouse-marker {
            background: transparent;
            border: none;
        }

        .player {
            width: 44px;
            height: 44px;
            position: relative;
        }

        .player-circle {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #3188ff;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 7px #555;
        }

        .player-direction {
            position: absolute;
            top: -5px;
            left: 16px;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 13px solid #164b9b;
            transform-origin: 6px 27px;
            z-index: 3;
        }

        .player-head {
            position: absolute;
            top: 8px;
            left: 15px;
            width: 14px;
            height: 14px;
            background: #ffd3a3;
            border: 2px solid white;
            border-radius: 50%;
            z-index: 2;
        }

        .player-body {
            position: absolute;
            top: 22px;
            left: 12px;
            width: 20px;
            height: 13px;
            background: white;
            border-radius: 8px 8px 5px 5px;
            border: 1px solid #164b9b;
            z-index: 2;
        }

        .mouse-marker { font-size: 30px; }

        @media (max-width: 600px) {
            header h1 { font-size: 25px; }

            button {
                width: 90%;
                max-width: 350px;
            }

            #map { height: 55vh; }
        }
    </style>
</head>

<body>

<header>
    <h1>🐱 Le jeu du chat</h1>
    <p>Le chat chasse, les souris s'échappent !</p>
</header>

<main>
    <h2>🗺️ Carte de l'Europe</h2>
    <p>Crée une partie ou rejoins tes amis !</p>

    <div id="infos">
        <strong id="statut">Connexion en cours...</strong>
        <p id="codePartie"></p>
    </div>

    <div id="map"></div>
<div id="capturePanel" style="
    display: none;
    background: white;
    max-width: 600px;
    margin: 15px auto;
    padding: 18px;
    border: 2px solid #237a3b;
    border-radius: 12px;
">
    <h2 id="captureTitre">🐱 Capture</h2>
    <p id="captureMessage"></p>
    <div id="captureActions"></div>
</div>
    <button onclick="creerPartie()">🐱 Créer une partie</button>
    <button onclick="rejoindrePartie()">🐭 Rejoindre une partie</button>
 <button onclick="arreterGPS()">⏹️ Arrêter le GPS</button>
    <button onclick="quitterPartie()">🚪 Quitter la partie</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
