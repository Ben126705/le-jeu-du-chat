
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le jeu du chat 🐱</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

    <header>
        <h1>🐱 Le jeu du chat</h1>
        <p>Le chat chasse, les souris s'échappent !</p>
    </header>

    <main>
        <h2>Carte de l'Europe 🗺️</h2>
        <p>Ton personnage te suit en direct !</p>

        <div id="map"></div>

        <button onclick="demarrerGPS()">📍 Activer mon GPS</button>
        <button onclick="arreterGPS()">⏹️ Arrêter le GPS</button>

        <button onclick="alert('La création de partie arrive bientôt !')">
            Créer une partie
        </button>

        <button onclick="alert('Le système pour rejoindre une partie arrive bientôt !')">
            Rejoindre une partie
        </button>
    </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Création de la carte
        const carte = L.map('map').setView([48.5, 10], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(carte);

        // Personnage humain
        const iconePersonnage = L.divIcon({
            className: "personnage",
            html: "🧍",
            iconSize: [35, 35],
            iconAnchor: [17, 17]
        });

        let marqueurJoueur = null;
        let suiviGPS = null;

        // Démarrer le GPS en continu
        function demarrerGPS() {

            if (!navigator.geolocation) {
                alert("Ton navigateur ne permet pas la géolocalisation.");
                return;
            }

            if (suiviGPS !== null) {
                return;
            }

            suiviGPS = navigator.geolocation.watchPosition(

                function(position) {

                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    const nouvellePosition = [latitude, longitude];

                    // Créer le personnage ou déplacer le personnage existant
                    if (marqueurJoueur === null) {

                        marqueurJoueur = L.marker(
                            nouvellePosition,
                            { icon: iconePersonnage }
                        )
                        .addTo(carte)
                        .bindPopup("👤 Tu es ici !")
                        .openPopup();

                    } else {

                        marqueurJoueur.setLatLng(nouvellePosition);

                    }

                    // Garder le personnage au centre de la carte
                    carte.setView(nouvellePosition, 16);

                },

                function(erreur) {
                    alert("Erreur GPS : " + erreur.message);
                    arreterGPS();
                },

                {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 15000
                }
            );
        }

        // Arrêter le GPS
        function arreterGPS() {

            if (suiviGPS !== null) {
                navigator.geolocation.clearWatch(suiviGPS);
                suiviGPS = null;
                alert("Le GPS est arrêté.");
            }
        }

        console.log("🐱 Le jeu du chat est chargé !");
    </script>

</body>
</html>
